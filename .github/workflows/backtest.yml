name: Run System Backtest

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run system backtest
        run: python src/system_backtest_v2.py

      - name: Upload backtest output
        uses: actions/upload-artifact@v4
        with:
          name: system-backtest-output
          path: output/
