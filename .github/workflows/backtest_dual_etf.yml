name: Run Dual ETF Backtest

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backtest_dual_etf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dual ETF backtest
        run: python src/system_backtest_dual_etf.py

      - name: Upload dual ETF backtest output
        uses: actions/upload-artifact@v4
        with:
          name: system-backtest-dual-etf-output
          path: output_dual_etf/
